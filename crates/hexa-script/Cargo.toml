[package]
name = "hexa-script"
description = "Scripting and WASM plugins for Hexa"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
hexa-core = { path = "../hexa-core" }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
wasmi = "2.0.0"

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.263.0"
