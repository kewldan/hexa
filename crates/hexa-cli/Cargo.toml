[package]
name = "hexa-cli"
description = "Headless command-line interface of Hexa"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hexa-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
hexa-analysis = { path = "../hexa-analysis" }
hexa-core = { path = "../hexa-core" }
hexa-diff = { path = "../hexa-diff" }
hexa-re = { path = "../hexa-re" }
hexa-sys = { path = "../hexa-sys" }
hexa-template = { path = "../hexa-template" }
hexa-transform = { path = "../hexa-transform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
