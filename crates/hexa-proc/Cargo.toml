[package]
name = "hexa-proc"
description = "Process memory for Hexa: process list, memory maps, read/write, value scanner, pointer scan, GDB remote"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Talking to the OS (raw devices, other processes) needs unsafe FFI calls;
# every other crate keeps unsafe code denied.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
unusual_byte_groupings = "allow"

[dependencies]
hexa-core = { path = "../hexa-core" }
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "user"] }
thiserror = "2.0.21"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
