[package]
name = "hexa-transform"
description = "Data transformations for Hexa: bit ops, arithmetic, encodings, compression, encryption, recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
base64 = "0.23.1"
blowfish = "0.10.0"
brotli = "9.1.1"
bs58 = "0.5.1"
bzip2 = "0.6.1"
chacha20 = "0.10.2"
cipher = "0.5.2"
data-encoding = "2.11.1"
des = "0.9.0"
flate2 = "1.1.11"
hexa-core = { path = "../hexa-core" }
lz4_flex = "0.14.0"
lzma-rust2 = "0.25.0"
lzokay-native = "0.2.1"
rc4 = "0.2.0"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snap = "1.1.2"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
