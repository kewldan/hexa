[package]
name = "hexa-net"
description = "Remote and container sources for Hexa: HTTP range, S3, SFTP, network streams, files inside archives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.11"
hex = "0.4.3"
hexa-core = { path = "../hexa-core" }
hmac = "0.13.0"
lru = "0.19.0"
parking_lot = "0.13.0"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = "0.25.0"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd"] }
