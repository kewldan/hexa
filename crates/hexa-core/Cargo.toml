[package]
name = "hexa-core"
description = "Core data model of the Hexa hex editor: providers, persistent piece tree, history, saving, search."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick = "1.1.5"
base64 = "0.23.1"
blake2 = "0.11.0"
blake3 = "1.8.7"
digest = "0.11.3"
encoding_rs = "0.8.44"
half = "2.7.1"
lru = "0.19.0"
md-5 = "0.11.0"
md4 = "0.11.0"
memchr = "2.8.3"
parking_lot = "0.13.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
ripemd = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"
tiger = "0.3.0"
whirlpool = "0.11.0"

[target."cfg(unix)".dependencies]
xattr = "1.7.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
