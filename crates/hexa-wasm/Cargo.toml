[package]
name = "hexa-wasm"
description = "WebAssembly bindings of the Hexa hex editor engine (npm package)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
hexa-analysis = { path = "../hexa-analysis" }
hexa-core = { path = "../hexa-core" }
hexa-diff = { path = "../hexa-diff" }
hexa-transform = { path = "../hexa-transform" }
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
# Must match the installed `wasm-bindgen` CLI exactly (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# hexa-transform's ciphers pull getrandom 0.4, which needs the JS backend on
# wasm32-unknown-unknown.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
