[package]
name = "hexa-sys"
description = "System-level providers for Hexa: disks, partitions, file systems, disk images, process memory, GDB remote"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Talking to the OS (raw devices, other processes) needs unsafe FFI calls;
# every other crate keeps unsafe code denied.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
unusual_byte_groupings = "allow"

[dependencies]
hexa-core = { path = "../hexa-core" }
