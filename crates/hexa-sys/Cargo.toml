[package]
name = "hexa-sys"
description = "System-level providers for Hexa: disks, partitions, file systems, disk images, process memory, GDB remote"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Talking to the OS (raw devices, other processes) needs unsafe FFI calls;
# every other crate keeps unsafe code denied.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
unusual_byte_groupings = "allow"

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.11"
getrandom = "0.4.3"
hexa-core = { path = "../hexa-core" }
lru = "0.19.0"
lzfse_rust = "0.2.1"
md-5 = "0.11.0"
memchr = "2.8.3"
parking_lot = "0.13.0"
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
xattr = "1.7.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3.27.0"
