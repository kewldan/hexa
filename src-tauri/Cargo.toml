[package]
name = "hexa"
description = "Hexa — cross-platform hex editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "hexa_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
boreal = { version = "1", default-features = false, features = ["hash", "object"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
getrandom = "0.4.3"
hexa-analysis = { path = "../crates/hexa-analysis" }
hexa-core = { path = "../crates/hexa-core" }
hexa-diff = { path = "../crates/hexa-diff" }
hexa-net = { path = "../crates/hexa-net" }
hexa-proc = { path = "../crates/hexa-proc" }
hexa-re = { path = "../crates/hexa-re" }
hexa-script = { path = "../crates/hexa-script" }
hexa-sys = { path = "../crates/hexa-sys" }
hexa-transform = { path = "../crates/hexa-transform" }
notify = "8.2.2"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
