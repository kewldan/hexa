name: Release

# Push a tag like v1.2.3 to build installers and CLI binaries on every
# platform and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Hexa ${TAG}" > notes.md
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Hexa ${TAG#v}" --notes-file notes.md
          fi

  app:
    name: App (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: oven-sh/setup-bun@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.TAG }}
          releaseDraft: true
          args: ${{ matrix.args }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p hexa-cli --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="hexa-cli-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/hexa-cli.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            file="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/hexa-cli" "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          gh release upload "$TAG" "$file" --clobber

  publish:
    name: Publish
    needs: [app, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets
          (cd assets && sha256sum * > SHA256SUMS.txt)
          gh release upload "$TAG" assets/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
